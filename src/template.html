<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Todo List</title>
</head>
<body>
    <div class="sidebar">
        <div class="profile">
            <div class="avatar"></div>
            <p>Joshua</p>
        </div>
        <div class="add-task-container">
            <div class="nav-icon add-task">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
                </svg>
            </div>
            <button id="add-task">Add Task</button>
        </div>
        <nav class="nav-top">
            <div class="nav-top-card">
                <div class="nav-icon today">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M9,5V9H21V5M9,19H21V15H9M9,14H21V10H9M4,9H8V5H4M4,19H8V15H4M4,14H8V10H4V14Z"/>
                    </svg>
                </div>
                <button id="to-do">To do</button>
            </div>
            <div class="nav-top-card">
                <div class="nav-icon to-do">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M7,10H12V15H7M19,19H5V8H19M19,3H18V1H16V3H8V1H6V3H5C3.89,3 3,3.9 3,5V19A2,
                        2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z"/>
                    </svg>
                </div>
                <button id="today">Today</button>
            </div>
            <div class="nav-top-card">
                <div class="nav-icon upcoming">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M15,13H16.5V15.82L18.94,17.23L18.19,18.53L15,16.69V13M19,8H5V19H9.67C9.24,
                        18.09 9,17.07 9,16A7,7 0 0,1 16,9C17.07,9 18.09,9.24 19,9.67V8M5,21C3.89,21 3,20.1 3,
                        19V5C3,3.89 3.89,3 5,3H6V1H8V3H16V1H18V3H19A2,2 0 0,1 21,5V11.1C22.24,12.36 23,14.09 23,
                        16A7,7 0 0,1 16,23C14.09,23 12.36,22.24 11.1,21H5M16,11.15A4.85,4.85 0 0,0 11.15,
                        16C11.15,18.68 13.32,20.85 16,20.85A4.85,4.85 0 0,0 20.85,16C20.85,13.32 18.68,11.15 16,11.15Z"/>
                    </svg>
                </div>
                <button id="upcoming">Upcoming</button>
            </div>
        </nav>
        <nav class="nav-bottom">
            <div class="nav-bot-card">
                <button id="projects">Projects</button>
            </div>
            <div id="project-container"></div>
        </nav>
        <div class="sidebar-footer">
            &copy;
            <a href="https://www.theodinproject.com/about" target="_blank">The Odin Project</a>. All rights reserved. 
            <a href="https://github.com/yehoshua-001/todo-list" target="_blank">github.com/yehoshua-001</a>
        </div>
    </div>
    <div class="main">
        <div id="content"></div>
    </div>
    <div class="dialog">
        <dialog id="add-task-dialog">
            <input type="text" name="todo" id="todo">
        </dialog>
    </div>
</body>
</html>
